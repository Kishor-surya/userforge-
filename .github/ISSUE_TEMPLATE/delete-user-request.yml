name: "\U0001F5D1️ Delete User Request"
description: Request a user be permanently removed from UserForge. Only requests from repo owners/collaborators are processed automatically.
title: "[Delete User] "
labels: ["user-request", "delete-user"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form permanently deletes a user record from UserForge. Only
        issues opened by a repo owner or collaborator are processed automatically —
        anyone else's request will be closed unactioned.
  - type: input
    id: email
    attributes:
      label: Email of user to delete
      placeholder: jane.doe@example.com
    validations:
      required: true
