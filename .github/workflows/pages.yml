name: Publish Metrics to GitHub Pages

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run gitleaks (report only, for the dashboard)
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest \
            detect --source /repo --report-format json --report-path /repo/gitleaks-report.json \
            --exit-code 0 --no-banner || true
          if [ ! -f gitleaks-report.json ]; then echo "[]" > gitleaks-report.json; fi

      - name: Fetch CodeQL alert metrics
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
            } catch (err) {
              core.warning(`Could not fetch CodeQL alerts: ${err.message}`);
            }
            const bySeverity = {};
            for (const a of alerts) {
              const sev = (a.rule && (a.rule.security_severity_level || a.rule.severity)) || 'unknown';
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            }
            fs.writeFileSync('codeql-metrics.json', JSON.stringify({ total: alerts.length, bySeverity }, null, 2));

      - name: Fetch Dependabot alert metrics
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
            } catch (err) {
              core.warning(`Could not fetch Dependabot alerts: ${err.message}`);
            }
            const bySeverity = {};
            for (const a of alerts) {
              const sev = (a.security_advisory && a.security_advisory.severity) || 'unknown';
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            }
            fs.writeFileSync('dependabot-metrics.json', JSON.stringify({ total: alerts.length, bySeverity }, null, 2));

      - name: Build dashboard site
        run: node scripts/build-dashboard.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
